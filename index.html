<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>TSC 4급 13주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column. Sticky header + tab bar; content as stacked sheets. Hanzi set large in serif, pinyin + 뜻 below and toggleable. */
:root{
  --bg:#F5F7F4; --surface:#FFFFFF; --fg:#18221E; --muted:#5B6862; --line:#DCE3DE;
  --accent:#0D6A5A; --accent-soft:#E0EFE9; --seal:#B5322A; --seal-soft:#F6E3E0;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-zh:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#171F1C; --fg:#E4ECE8; --muted:#94A39C; --line:#28332F;
  --accent:#55BBA2; --accent-soft:#1B332D; --seal:#E36A5E; --seal-soft:#3A1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#171F1C; --fg:#E4ECE8; --muted:#94A39C; --line:#28332F;
  --accent:#55BBA2; --accent-soft:#1B332D; --seal:#E36A5E; --seal-soft:#3A1F1C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0}
.titlerow{display:flex;align-items:center;gap:12px}
.seal{flex:none;width:44px;height:44px;border-radius:8px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--f-zh);font-weight:700;font-size:15px;line-height:1.05;text-align:center}
.titlerow h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.titlerow p{margin:0;color:var(--muted);font-size:13px}
.prog{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
nav.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:1 0 auto;text-align:center;padding:10px 12px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.toggles{display:flex;gap:8px;flex-wrap:wrap;padding-block:12px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

section.view{display:flex;flex-direction:column;gap:14px}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
h2{margin:18px 0 0;font-size:17px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* routine */
.routine{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.routine div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.routine b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.routine span{font-size:12px;color:var(--muted);line-height:1.4;display:block}

/* weeks */
.weeks{display:flex;flex-direction:column;gap:8px}
.week{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.week.now{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal) inset}
.week.done{opacity:.6}
.week input{flex:none;width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.week .body{min-width:0;flex:1}
.week .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.week .meta b{color:var(--fg);font-family:var(--f-mono);font-size:12px}
.tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--seal-soft);color:var(--seal)}
.tag.green{background:var(--accent-soft);color:var(--accent)}
.week .what{margin:4px 0 0;font-size:14px;font-weight:500}
.week .goal{margin:2px 0 0;font-size:13px;color:var(--muted)}
.week label{display:contents}

/* parts table */
.parts{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.parts th,.parts td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.parts tr:last-child td{border-bottom:0}
.parts th{font-size:11px;color:var(--muted);font-weight:600}

/* accordion */
details.part{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.part>summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px}
details.part>summary::-webkit-details-marker{display:none}
details.part>summary .pn{font-family:var(--f-mono);font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;flex:none}
details.part>summary .pt{font-weight:600;flex:1;min-width:0}
details.part>summary .pm{font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
details.part>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .2s;flex:none}
details.part[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.pbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.tip{font-size:13px;color:var(--muted);margin:0}

.line{display:flex;gap:10px}
.line .n{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--muted);width:18px;padding-top:4px}
.line .c{min-width:0;flex:1}
.lab{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px}
.zh{font-family:var(--f-zh);font-size:19px;font-weight:500;line-height:1.5;word-break:break-all}
.zh .blank{color:var(--seal)}
.py{font-size:13px;color:var(--accent);margin-top:2px}
.ko{font-size:13px;color:var(--muted);margin-top:1px}
body.no-py .py{display:none}
body.no-ko .ko{display:none}

/* questions */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.q .qh{display:flex;gap:8px;align-items:center}
.q .ans{border-top:1px dashed var(--line);padding-top:10px}
.q .ans .zh{font-size:17px}
.reveal{align-self:flex-start;appearance:none;border:1px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topics span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

/* words */
.wgroup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.wgroup h3{margin:0 0 10px;font-size:14px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.word{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.word .zh{font-size:18px}
.word .py{font-size:12px}
.word .ko{font-size:12px}

/* checklist */
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;cursor:pointer}
.check input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent)}
.check.on span{text-decoration:line-through;color:var(--muted)}
ul.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.rules li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
ul.rules li .zh{font-size:16px;display:inline}
.foot{font-size:12px;color:var(--muted);margin-top:8px}
.foot a{color:var(--accent)}
/* pronunciation */
.zhrow{display:flex;align-items:flex-start;gap:8px}
.zhrow .zh{flex:1;min-width:0}
.say{flex:none;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--accent);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.say:active{background:var(--accent-soft)}
.line.playing .zh,.word.playing .zh{color:var(--accent)}
.line.playing .say{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.line.repeat .zh{color:var(--seal)}
.word{cursor:pointer}
.word.playing{border-color:var(--accent)}
.shadowbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shadowbar .st{font-size:13px;color:var(--muted)}
.shadowbar .st.rep{color:var(--seal);font-weight:600}
/* how-to per part */
.howto{background:var(--accent-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hw{display:flex;flex-direction:column;gap:4px;font-size:14px}
.hw span{display:inline-block;min-width:52px;font-size:11px;font-weight:700;color:var(--accent);margin-right:6px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;font-weight:600}
.flow span{background:var(--surface);border-radius:6px;padding:4px 8px}
.flow span.rec{background:var(--seal);color:#fff}
.flow i{font-style:normal;color:var(--muted)}
.sigs{display:flex;flex-direction:column;gap:6px}
.sig{display:flex;gap:10px;background:var(--surface);border-radius:8px;padding:8px 10px;align-items:center}
.sig .sk{flex:none;width:38%;min-width:0;display:flex;flex-direction:column}
.sig .sk .zh{font-size:16px}
.sig .sk .py{font-size:11px;margin:0}
.sig .sv{min-width:0;flex:1;display:flex;flex-direction:column;font-size:12px}
.sig .sv b{color:var(--muted);font-weight:600}
.sig .sv .zh{font-size:15px}
.alloc{display:flex;gap:2px;border-radius:8px;overflow:hidden}
.seg{min-width:38px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:10px;line-height:1.3}
.seg b{font-size:12px;font-variant-numeric:tabular-nums}
.seg.s0{background:var(--accent);color:var(--bg)}
.seg.s1{background:var(--surface);color:var(--fg)}
.howto .tip b{color:var(--accent)}
/* illustrations */
.ill{display:block;width:100%;height:auto;max-height:200px}
.ill .s{stroke:var(--fg);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.ill .f1{fill:var(--accent-soft)}
.ill .f2{fill:var(--surface)}
.ill .ac{fill:var(--accent)}
.ill .sl{fill:var(--seal)}
.ill .mu{fill:var(--muted);opacity:.6}
.ill .dr{stroke:var(--accent)}
.ill text{font-family:var(--f-mono);font-size:14px;font-weight:600}
.ill .tw{fill:#fff}
.q .pic,.scr-body .pic{border-style:solid;padding:8px;background:var(--surface)}
.pics .pic small{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:left;margin:0 0 2px}
/* handwriting sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,16,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none!important}
.sheet-in{background:var(--bg);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:94vh;overflow:auto}
.ws-head{display:flex;align-items:flex-start;gap:10px}
.ws-head>div{flex:1;min-width:0}
.ws-head .zh{font-size:28px}
.ws-chars{display:flex;gap:6px;flex-wrap:wrap}
.ws-chars:empty{display:none}
.ws-pad{align-self:center;width:min(300px,100%);aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;position:relative;touch-action:none;overflow:hidden}
.ws-pad svg.grid{position:absolute;inset:0;width:100%;height:100%}
.ws-pad svg.grid path{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4;fill:none}
#ws-target{position:absolute;inset:0}
#ws-target canvas{position:absolute;inset:0;width:100%;height:100%}
#ws-target .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-zh);font-size:200px;color:var(--line);line-height:1}
.ws-msg{font-size:13px;line-height:1.4;color:var(--muted);text-align:center;min-height:2.8em;display:flex;align-items:center;justify-content:center}
.sheet .simctl{justify-content:center}
.sheet .simctl .btn{padding:10px 14px}
#ws-blind[aria-pressed="true"],#ws-quiz[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#ws-quiz[aria-pressed="false"]{background:transparent;color:var(--fg);border:1px solid var(--line)}
.mine{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rec{color:var(--seal)}
/* tap-to-write characters */
#v-tpl .hz{cursor:pointer;border-radius:4px;text-decoration:underline dotted var(--line);text-underline-offset:5px}
.hz:active{background:var(--accent-soft)}
#ws-title.long{font-size:17px;line-height:1.45}
.sheet-in.long .ws-head .py,.sheet-in.long .ws-head .ko{font-size:12px;line-height:1.4}
.sheet-in.long{gap:8px}
.sheet-in>*{flex:none}
.ws-chars{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ws-chars::-webkit-scrollbar{display:none}
.ws-chars .chip{flex:none}
/* AI grammar */
.gram{display:none;flex:none;appearance:none;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);height:34px;padding:0 10px;border-radius:17px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
body.ai-on .gram{display:inline-block}
.g-out{font-size:14px;line-height:1.6;min-height:120px}
.g-out h4{margin:14px 0 4px;font-size:14px;color:var(--accent)}
.g-out h4:first-child{margin-top:0}
.g-out p{margin:4px 0}
.g-out ul{margin:4px 0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.g-out .wait{color:var(--muted)}
.g-note{font-size:12px;color:var(--muted)}
.tap{cursor:pointer;border-radius:4px}
.tap .spk{display:inline-block;vertical-align:middle;margin-left:4px;color:var(--accent);opacity:.8}
.tap.playing{color:var(--accent);background:var(--surface)}
/* vocab quiz */
.wquiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wquiz h2{margin:0}
.wq-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.wq-row{display:flex;align-items:center;gap:8px}
.wq-row select{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.wq-box{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.wq-prog{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wq-q{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;min-height:64px;text-align:center}
.wq-q .zh{font-size:40px}
.wq-ko{font-size:22px;font-weight:700}
.wq-q .py{font-size:15px}
.wq-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wq-opt{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:15px;padding:14px 8px;border-radius:10px;cursor:pointer;min-height:56px}
.wq-opt.zh{font-family:var(--f-zh);font-size:22px}
.wq-opt.ok{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.wq-opt.no{border-color:var(--seal);background:var(--seal-soft);color:var(--seal)}
.wq-fb{min-height:1.5em;text-align:center;font-size:14px}
.wq-fb.ok{color:var(--accent)}
.wq-fb.no{color:var(--seal)}
.wq-fb .zh{font-size:18px}
.wq-pad{width:min(260px,100%)}
.wq-end{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.wq-end b{font-size:36px;font-variant-numeric:tabular-nums}
.wq-end span{color:var(--muted);font-size:14px}
/* compact header on scroll */
header.top.compact .titlerow,header.top.compact .prog{display:none}
header.top.compact{padding-block:4px 0}
.fc-card{perspective:900px;cursor:pointer;outline:none}
.fc-in{position:relative;min-height:220px;transition:transform .45s;transform-style:preserve-3d}
.fc-card.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:14px;background:var(--bg);backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:12px;text-align:center}
.fc-front .zh{font-size:56px}
.fc-back{transform:rotateY(180deg)}
.fc-back .zh{font-size:34px}
.fc-back .py{font-size:18px}
.fc-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fc-btns .btn{padding:14px}
details.lvl .pn{min-width:34px;text-align:center}
.startbox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.startbox label{display:flex;flex-direction:column;gap:2px;min-width:0}
.startbox input{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
ul.tasks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
ul.tasks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
ul.tasks input{flex:none;width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
ul.tasks input:checked+span{text-decoration:line-through;color:var(--muted)}
.gos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gos .chip{text-decoration:none;font-size:12px;padding:4px 10px}
.pr-list{display:flex;flex-direction:column;gap:6px}
.pr-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pr-k{flex:none;width:42%;display:flex;align-items:center;gap:6px;min-width:0}
.pr-k .zh{font-size:22px}
.pr-tag{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--seal);background:var(--seal-soft);border-radius:6px;padding:1px 6px}
.pr-v{flex:1;min-width:0;display:flex;flex-direction:column}
.pr-v .py{font-size:15px;margin:0}
.pr-v .ko{font-size:12px}
.pr-row.playing{border-color:var(--accent)}
.tone-chart{width:100%;max-width:420px;height:auto;align-self:center}
.tone-chart .tg{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;fill:none}
.tone-chart .tl{stroke:var(--accent);stroke-width:4;stroke-linecap:round;fill:none}
.tone-chart text{fill:var(--muted);font-size:12px;text-anchor:middle;font-family:var(--f-body)}
.ci{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.ci:empty{display:none}
.ci-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ci-h>b.zh{font-size:28px}
.ci-l{color:var(--muted)}
.ci-l b{color:var(--fg)}
.ci-p{font-size:15px;color:var(--fg);margin-top:2px}
.ci .zh{font-family:var(--f-zh)}
.ci-out{font-size:14px;line-height:1.6}
.ci-out h4{margin:10px 0 2px;font-size:13px;color:var(--accent)}
.ci-out p{margin:2px 0}
.ci-out ul{margin:2px 0;padding-left:18px}
.ex{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px dashed var(--line);text-align:center;max-width:100%}
.ex .zh{font-size:17px}
.ex .py{font-size:12px}
.ex .ko{font-size:12px}
.ex.playing{border-color:var(--accent)}
.wq-fb .ex{margin:6px auto 0}
#ws-ex .ex{align-items:flex-start;text-align:left;margin-top:4px;padding:6px 8px}
.sheet-in.long #ws-ex{display:none}
.fc-in{min-height:330px}
/* exam flow */
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0}
.steps li{display:flex;gap:12px;padding-bottom:14px;position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.steps .dot{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center;position:relative;z-index:1}
.steps .st{min-width:0}
.steps b{display:block;font-size:14px}
.steps span{font-size:13px;color:var(--muted)}
.cycle{display:flex;flex-direction:column;gap:6px}
.cy{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cy .k{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);min-width:52px;text-align:center}
.cy.rec .k{background:var(--seal-soft);color:var(--seal)}
.cy p{margin:0;font-size:13px;min-width:0}
.arrow{font-size:12px;color:var(--muted);padding-left:24px}
.note{background:var(--seal-soft);color:var(--fg);border-radius:12px;padding:14px;font-size:14px}
.note b{color:var(--seal)}
.note ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* simulator */
.screen{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scr-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scr-top b{color:var(--fg);font-family:var(--f-mono)}
.scr-body{padding:18px 14px;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.scr-body .zh{font-size:20px}
.pic{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;font-size:14px;color:var(--muted)}
.pic small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;margin-bottom:4px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pics .pic{padding:12px 8px;font-size:13px}
.listen{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.wave{display:flex;gap:3px;align-items:flex-end;height:18px}
.wave i{width:3px;background:var(--accent);border-radius:2px;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:5px}50%{height:18px}}
.scr-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.phase{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.phase .sec{font-family:var(--f-mono);font-size:18px}
.phase.rec{color:var(--seal)}
.recdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--seal);margin-right:6px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.tbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:100%}
.phase.rec+.tbar i{background:var(--seal)}
.simctl{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:0;background:var(--accent);color:var(--bg);font:inherit;font-size:14px;font-weight:600;padding:10px 18px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.review .q{gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fc-card:focus-visible .fc-in{outline:2px solid var(--accent);outline-offset:3px;border-radius:14px}
</style>

 Q(4,L("你平时常做运动吗？","Nǐ píngshí cháng zuò yùndòng ma?","평소에 운동 자주 해?"),L("我平时经常运动。因为上班压力挺大的，而且运动对身体好。比如说，我一个星期去三次健身房。所以我觉得运动挺重要的。","Wǒ píngshí jīngcháng yùndòng. Yīnwèi shàngbān yālì tǐng dà de, érqiě yùndòng duì shēntǐ hǎo. Bǐrú shuō, wǒ yí ge xīngqī qù sān cì jiànshēnfáng. Suǒyǐ wǒ juéde yùndòng tǐng zhòngyào de.","자주 해요. 회사 스트레스가 꽤 크고 운동은 몸에 좋거든요. 예를 들어 일주일에 세 번 헬스장에 가요. 그래서 운동이 꽤 중요한 것 같아요.")),
 Q(4,L("你喜欢在家做饭还是去饭店吃饭？","Nǐ xǐhuan zài jiā zuòfàn háishi qù fàndiàn chīfàn?","집밥이 좋아, 외식이 좋아?"),L("我喜欢在家做饭。因为在家做饭比较省钱，而且更健康。比如说，周末我经常给我老婆做饭。所以我觉得在家吃更好。","Wǒ xǐhuan zài jiā zuòfàn. Yīnwèi zài jiā zuòfàn bǐjiào shěng qián, érqiě gèng jiànkāng. Bǐrú shuō, zhōumò wǒ jīngcháng gěi wǒ lǎopo zuòfàn. Suǒyǐ wǒ juéde zài jiā chī gèng hǎo.","집밥이 좋아요. 돈도 아끼고 더 건강하거든요. 예를 들어 주말엔 자주 와이프한테 밥을 해줘요. 그래서 집에서 먹는 게 더 좋아요.")),
 Q(4,L("你怎么去上班？","Nǐ zěnme qù shàngbān?","출근 어떻게 해?"),L("我开车上班。因为开车很方便，而且我家离公司有点儿远。比如说，坐公交车要一个小时，开车只要三十分钟。所以我每天都开车上班。","Wǒ kāichē shàngbān. Yīnwèi kāichē hěn fāngbiàn, érqiě wǒ jiā lí gōngsī yǒudiǎnr yuǎn. Bǐrú shuō, zuò gōngjiāochē yào yí ge xiǎoshí, kāichē zhǐ yào sānshí fēnzhōng. Suǒyǐ wǒ měitiān dōu kāichē shàngbān.","차로 출근해요. 편하고 집이 회사에서 좀 멀어요. 버스는 한 시간, 차는 30분이면 돼요. 그래서 매일 운전해서 출근해요.")),
 Q(4,L("你有什么爱好？","Nǐ yǒu shénme àihào?","취미가 뭐야?"),L("我平时喜欢看棒球比赛。因为特别有意思，而且能放松一下。比如说，周末我经常跟朋友一起去看比赛。所以我觉得有个爱好挺好的。","Wǒ píngshí xǐhuan kàn bàngqiú bǐsài. Yīnwèi tèbié yǒu yìsi, érqiě néng fàngsōng yíxià. Bǐrú shuō, zhōumò wǒ jīngcháng gēn péngyou yìqǐ qù kàn bǐsài. Suǒyǐ wǒ juéde yǒu ge àihào tǐng hǎo de.","평소에 야구 보는 걸 좋아해요. 엄청 재밌고 스트레스도 풀리거든요. 주말에 친구랑 자주 경기 보러 가요. 그래서 취미가 있는 게 좋은 것 같아요.")),
 Q(5,L("你认为在家工作有什么好处？","Nǐ rènwéi zài jiā gōngzuò yǒu shénme hǎochù?","재택근무의 장점은?"),L("我觉得在家工作好处挺多的。首先，不用上下班，能省很多时间。还有，在家工作压力小，做事更快。当然也有不好的地方，不过好处更多。所以我觉得在家工作挺好的。","Wǒ juéde zài jiā gōngzuò hǎochù tǐng duō de. Shǒuxiān, búyòng shàng xià bān, néng shěng hěn duō shíjiān. Háiyǒu, zài jiā gōngzuò yālì xiǎo, zuò shì gèng kuài. Dāngrán yě yǒu bù hǎo de dìfang, búguò hǎochù gèng duō. Suǒyǐ wǒ juéde zài jiā gōngzuò tǐng hǎo de.","장점이 꽤 많은 것 같아요. 우선 출퇴근을 안 해도 돼서 시간을 많이 아껴요. 그리고 스트레스가 적어서 일을 더 빨리 해요. 물론 안 좋은 점도 있지만 좋은 점이 더 많아요. 그래서 재택근무가 괜찮다고 생각해요.")),
 Q(5,L("你认为孩子从小学外语好吗？","Nǐ rènwéi háizi cóngxiǎo xué wàiyǔ hǎo ma?","어릴 때부터 외국어 배우는 게 좋을까?"),L("我觉得孩子从小学外语挺好的。首先，小时候学语言特别快。还有，能学到很多东西，以后找工作也有帮助。当然也有不好的地方，比如太费钱了，不过好处更多。所以我觉得应该从小学外语。","Wǒ juéde háizi cóngxiǎo xué wàiyǔ tǐng hǎo de. Shǒuxiān, xiǎo shíhou xué yǔyán tèbié kuài. Háiyǒu, néng xuédào hěn duō dōngxi, yǐhòu zhǎo gōngzuò yě yǒu bāngzhù. Dāngrán yě yǒu bù hǎo de dìfang, bǐrú tài fèi qián le, búguò hǎochù gèng duō. Suǒyǐ wǒ juéde yīnggāi cóngxiǎo xué wàiyǔ.","좋은 것 같아요. 우선 어릴 때는 언어를 엄청 빨리 배워요. 그리고 많은 걸 배우고 나중에 취업에도 도움이 돼요. 돈이 너무 드는 단점도 있지만 좋은 점이 더 많아요. 그래서 어릴 때부터 배워야 한다고 생각해요.")),
 Q(6,L("这个星期六你要搬家，请给朋友打电话，请他来帮忙。","Zhège xīngqīliù nǐ yào bānjiā, qǐng gěi péngyou dǎ diànhuà, qǐng tā lái bāngmáng.","이번 토요일에 이사해요. 친구에게 전화해서 도와달라고 하세요."),L("喂，小王，你好！我想请你帮个忙。这个星期六我要搬家，你能来帮我吗？太谢谢你了，下次我请你吃饭。","Wéi, Xiǎo Wáng, nǐ hǎo! Wǒ xiǎng qǐng nǐ bāng ge máng. Zhège xīngqīliù wǒ yào bānjiā, nǐ néng lái bāng wǒ ma? Tài xièxie nǐ le, xià cì wǒ qǐng nǐ chīfàn.","샤오왕! 부탁 좀 할게. 이번 토요일에 이사하는데 도와줄 수 있어? 고마워, 다음에 밥 살게.")),
 Q(6,L("你想明天晚上和朋友去饭店吃饭，请给饭店打电话预订。","Nǐ xiǎng míngtiān wǎnshang hé péngyou qù fàndiàn chīfàn, qǐng gěi fàndiàn dǎ diànhuà yùdìng.","내일 저녁 친구들과 식당에 가려고 해요. 전화로 예약하세요."),L("你好，我想订明天晚上的位子。我们一共四个人，七点到。有包间吗？谢谢。","Nǐ hǎo, wǒ xiǎng dìng míngtiān wǎnshang de wèizi. Wǒmen yígòng sì ge rén, qī diǎn dào. Yǒu bāojiān ma? Xièxie.","내일 저녁 자리 예약하고 싶어요. 4명이고 7시에 가요. 룸 있나요? 감사합니다.")),
 Q(6,L("朋友约你明天去看电影，可是你要加班。请你拒绝他。","Péngyou yuē nǐ míngtiān qù kàn diànyǐng, kěshì nǐ yào jiābān. Qǐng nǐ jùjué tā.","친구가 내일 영화 보자는데 야근이에요. 거절하세요."),L("真不好意思，我明天得加班，看不了电影了。下次再一起去吧！","Zhēn bù hǎoyìsi, wǒ míngtiān děi jiābān, kàn bu liǎo diànyǐng le. Xià cì zài yìqǐ qù ba!","정말 미안, 내일 야근해야 해서 영화 못 보겠다. 다음에 같이 가자!")),
 Q(6,L("你昨天买的衣服太小了，请你去商店要求换一件。","Nǐ zuótiān mǎi de yīfu tài xiǎo le, qǐng nǐ qù shāngdiàn yāoqiú huàn yí jiàn.","어제 산 옷이 너무 작아요. 가게에 가서 교환을 요청하세요."),L("你好，我昨天在这儿买了一件衣服，但是太小了。能不能给我换一件大的？","Nǐ hǎo, wǒ zuótiān zài zhèr mǎile yí jiàn yīfu, dànshì tài xiǎo le. Néng bu néng gěi wǒ huàn yí jiàn dà de?","어제 여기서 옷을 샀는데 너무 작아요. 큰 걸로 바꿔주실 수 있나요?")),
 Q(7,L("请根据四幅图的内容讲述一个完整的故事。","Qǐng gēnjù sì fú tú de nèiróng jiǎngshù yí ge wánzhěng de gùshi.","4컷 그림을 보고 하나의 이야기를 말하세요."),L("今天天气很好，小明去了公园。他坐在椅子上看书。突然，下雨了。他没带雨伞，很着急。最后，一个女孩儿给了他一把雨伞。这真是难忘的一天。","Jīntiān tiānqì hěn hǎo, Xiǎo Míng qùle gōngyuán. Tā zuò zài yǐzi shang kàn shū. Tūrán, xià yǔ le. Tā méi dài yǔsǎn, hěn zháojí. Zuìhòu, yí ge nǚháir gěile tā yì bǎ yǔsǎn. Zhè zhēn shì nánwàng de yì tiān.","날씨가 좋아 샤오밍은 공원에 갔다. 벤치에서 책을 읽었다. 갑자기 비가 왔다. 우산이 없어 당황했다. 결국 한 여자아이가 우산을 줬다. 잊지 못할 하루였다."),["① 공원에 가는 남자","② 벤치에서 책 읽기","③ 갑자기 비","④ 여자아이가 우산을 줌"])
];

function currentWeek(){
  const now=new Date(); const diff=Math.floor((now-START)/864e5);
  if(diff<0) return 0; const w=Math.floor(diff/7)+1; return w>13?14:w;
}

  ${PARTS.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td></tr>`).join("")}

  updateProg();
}
function weeksDone(){return WEEKS.filter((w,i)=>w.tasks.every((_,k)=>store.get(`tsc-t${i+1}-${k}`,false))).length}
function updateProg(){
  const d=weeksDone();
  document.getElementById("barfill").style.width=(d/13*100)+"%";
  document.getElementById("progtext").textContent=`${d}/13주`;
  const end=addD(START,90); const left=Math.ceil((end-new Date())/864e5);
  const st=Math.ceil((START-new Date())/864e5);
  document.getElementById("dday").textContent=st>0?`시작까지 D-${st} · ${fmt(START)} 시작`:left>0?`W13 종료까지 D-${left} · ${fmt(addD(START,84))}~${fmt(end)} 응시`:"응시 주간 지남 · 시작일을 다시 정해줘";
}

let simSel="mini", simRun=null, tts=true, sub=false, actx=null;

  if(simSel==="mini"){return [1,2,3,4,5,6,7].map(p=>{const l=pick(p);return l[Math.floor(Math.random()*l.length)]})}

function zhVoice(){try{const vs=speechSynthesis.getVoices();return vs.find(v=>/^zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))}catch(e){return null}}

function fallbackTTS(t,fin){

let spTimer=null;
function playSprite(sp,fin){
  const [g,st,du]=sp, url=`${(male&&!g.startsWith("ex"))?"m":"f"}-${g}.mp3`, r=(g.startsWith("ex")||g==="sent")?(slow?0.75:1):(slow?0.65:0.85);
  clearTimeout(spTimer); player.onended=fin; player.onerror=()=>fin(); player.defaultPlaybackRate=r;
  const go=()=>{try{player.currentTime=Math.max(0,st-0.02)}catch(e){} player.muted=false; player.playbackRate=r; const pr=player.play(); if(pr&&pr.catch)pr.catch(()=>fin()); spTimer=setTimeout(()=>{try{player.pause()}catch(e){} fin()},(du+0.1)/r*1000);};
  if(player.dataset.src!==url){player.dataset.src=url; player.src=url; player.muted=true; const pr=player.play(); if(pr&&pr.catch)pr.catch(()=>{});
    const ready=()=>{try{player.pause()}catch(e){} go()}; if(player.readyState>=1) ready(); else player.addEventListener("loadedmetadata",ready,{once:true});}
  else go();
}
function stopAudio(){clearTimeout(spTimer);try{player.pause()}catch(e){} try{speechSynthesis.cancel()}catch(e){} if(curFin){const f=curFin;curFin=null;f()}}
function ttsSpeak(text){
  stopAudio();
  return new Promise(res=>{
  let done=false;const fin=()=>{if(!done){done=true;if(curFin===fin)curFin=null;player.onended=player.onerror=null;res()}};
  curFin=fin;
  const t=String(text).replace(/_{2,}/g,"，").replace(/[○]/g,"");
  const sp=WSPR[text]; if(sp){playSprite(sp,fin);return}
  const f=AUDIO[text];
  if(!f){fallbackTTS(t,fin);return}
  try{
    player.dataset.src=""; player.muted=false;
    player.src=(male?"vm/":"vf/")+f+".mp3";
    const r=slow?.75:1; player.defaultPlaybackRate=r; player.playbackRate=r;
    player.onended=fin; player.onerror=()=>{if(!done)fallbackTTS(t,fin)};
    const pr=player.play(); if(pr&&pr.catch) pr.catch(()=>{if(!done)fallbackTTS(t,fin)});
    setTimeout(fin,30000);
  }catch(e){fallbackTTS(t,fin)}
})}
function speak(text){ if(!tts) return new Promise(r=>setTimeout(r,1500)); return ttsSpeak(text); }

  const ph=document.getElementById("s-phase");
  ph.className="phase"+(rec?" rec":"");
  ph.innerHTML=`<span>${rec?'<span class="recdot"></span>':""}${label}</span><span class="sec">${sec==null?"--":sec+"초"}</span>`;

function countdown(total,label,rec,token){return new Promise(res=>{
  if(total<=0) return res();
  const t0=performance.now();
  const tick=()=>{ if(simRun!==token) return res();
    const el=(performance.now()-t0)/1000, left=Math.max(0,total-el);
    setPhase(label,Math.ceil(left),left/total,rec);
    if(left<=0) return res(); requestAnimationFrame(tick)};
  tick();
})}
async function runSim(){
  const token={}; simRun=token;
  const queue=buildQueue();
  document.getElementById("s-start").hidden=true; document.getElementById("s-stop").hidden=false;
  document.getElementById("s-review").hidden=true;
  for(let i=0;i<queue.length;i++){
    if(simRun!==token) break;
    const it=queue[i], c=SIMCFG[it.p];
    document.getElementById("s-part").innerHTML=`<b>Part ${it.p}</b> ${c.name}`;
    document.getElementById("s-count").textContent=`${i+1} / ${queue.length}`;
    showQ(it,true); setPhase("질문",null,1,false);
    await speak(it.q.zh); if(simRun!==token) break;
    showQ(it,false);
    await countdown(c.prep,"준비 시간",false,token); if(simRun!==token) break;
    beep();
    await countdown(c.ans,"답변 · 녹음 중",true,token);
  }
  if(simRun!==null && simRun!==token) return;
  const finished = simRun===token;
  simRun=null; stopAudio();
  document.getElementById("s-start").hidden=false; document.getElementById("s-stop").hidden=true;
  document.getElementById("s-start").textContent="다시 시작";
  setPhase(finished?"종료":"중단됨",null,0,false);
  document.getElementById("s-body").innerHTML=`<p class="lead" style="margin:0">${finished?"끝. 시험장에서도 이렇게 아무 반응 없이 끝난다. 아래에서 모범 답안과 비교해보기.":"중단했어. 다시 시작하면 처음부터."}</p>`;
  if(finished){const r=document.getElementById("s-review");r.hidden=false;
    r.innerHTML=`<h2>모범 답안 확인</h2>`+queue.map(it=>`<article class="q"><div class="qh"><span class="tag green">P${it.p}</span></div>${lineHTML(it.q)}<div class="ans">${lineHTML(it.a)}</div></article>`).join("");}
}
function wireSim(){
  document.querySelectorAll("#simsel [data-s]").forEach(b=>b.addEventListener("click",()=>{
    if(simRun) return; simSel=b.dataset.s;
    document.querySelectorAll("#simsel [data-s]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  }));
  const tb=document.getElementById("s-tts"), sb=document.getElementById("s-sub");
  tb.addEventListener("click",()=>{tts=!tts;tb.setAttribute("aria-pressed",String(tts))});
  sb.addEventListener("click",()=>{sub=!sub;sb.setAttribute("aria-pressed",String(sub))});
  document.getElementById("s-start").addEventListener("click",()=>{
    try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
    runSim();
  });
  document.getElementById("s-stop").addEventListener("click",()=>{simRun=null;stopAudio()});
  try{speechSynthesis.getVoices()}catch(e){}
}

let STROKES=null, hwLoading=null, writer=null, wsWord=null, wsIdx=0;
function loadHW(){ if(hwLoading) return hwLoading;
  hwLoading=Promise.all([
    new Promise((res,rej)=>{ if(window.HanziWriter) return res(); const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s)}),
    fetch("strokes.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{STROKES=d})
  ]).catch(e=>{hwLoading=null;throw e}); return hwLoading; }
const wsMsg=t=>{document.getElementById("ws-msg").textContent=t};
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#333"}
function openWriter(w,start,quiet){
  wsWord=w; wsIdx=start||0; wsBlind=false; document.getElementById("ws-blind").setAttribute("aria-pressed","false"); document.getElementById("ws-quiz").removeAttribute("aria-pressed");
  const sh=document.getElementById("wsheet"); sh.hidden=false;
  document.getElementById("ws-title").textContent=w.zh;
  document.getElementById("ws-py").textContent=w.py;
  document.getElementById("ws-ko").textContent=w.ko;
  const wx=document.getElementById("ws-ex"); if(wx) wx.innerHTML=exHTML(w.zh);
  document.getElementById("ws-say").dataset.say=w.zh;
  if(!quiet) ttsSpeak(w.zh);
  const isLong=chars().length>4;
  document.getElementById("ws-title").classList.toggle("long",isLong);
  document.querySelector(".sheet-in").classList.toggle("long",isLong);
  renderChips(); fitPad(); wsMsg("불러오는 중…");
  loadHW().then(()=>showChar()).catch(()=>{wsMsg("획순 데이터를 못 불러와서 연한 글자 위에 따라 쓰기만 돼. '따라 쓰기'를 누르면 지워져."); fallbackPad()});
}
function fitPad(){
  const sh=document.querySelector(".sheet-in"), pad=document.querySelector(".ws-pad");
  const info=document.getElementById("ws-info"); if(info) info.style.display="none";
  pad.style.width=""; const base=pad.getBoundingClientRect().width;
  const over=sh.scrollHeight-sh.clientHeight;
  if(over>0) pad.style.width=Math.max(160,Math.floor(base-over-4))+"px";
  if(info) info.style.display="";
  const cur=document.querySelector('#ws-chars [aria-pressed="true"]'); cur&&cur.scrollIntoView({block:"nearest",inline:"center"});
}
window.addEventListener("resize",()=>{ if(!document.getElementById("wsheet").hidden && wsWord){ fitPad(); if(writer) showChar(); }});
function chars(){return [...wsWord.zh].filter(c=>/[一-鿿]/.test(c))}
function renderChips(){
  const cs=chars(), el=document.getElementById("ws-chars");
  el.innerHTML=cs.length>1?cs.map((c,i)=>`<button class="chip" data-wc="${i}" aria-pressed="${i===wsIdx}"><span lang="zh-CN" style="font-family:var(--f-zh)">${c}</span></button>`).join(""):"";
}
function showChar(){
  const t=document.getElementById("ws-target"); t.innerHTML="";
  const c=chars()[wsIdx]; if(!c) return;
  const size=Math.floor(t.getBoundingClientRect().width)||260;
  writer=HanziWriter.create(t,c,{width:size,height:size,padding:14,showOutline:!wsBlind,showCharacter:!wsBlind,
    strokeColor:tok("--fg"),outlineColor:tok("--line"),drawingColor:tok("--accent"),highlightColor:tok("--seal"),
    drawingWidth:Math.max(14,size/16),strokeAnimationSpeed:1,delayBetweenStrokes:250,
    charDataLoader:(ch,onLoad,onErr)=>{STROKES&&STROKES[ch]?onLoad(STROKES[ch]):onErr()}});
  renderCI();
  wsMsg("'획순 보기'로 순서 보고, '따라 쓰기'로 손가락으로 써봐.");
  renderChips(); const cur=document.querySelector('#ws-chars [aria-pressed="true"]'); cur&&cur.scrollIntoView({block:"nearest",inline:"center"});
}
let wsBlind=false;
function startQuiz(){
  if(!writer) return;
  if(wsBlind){try{writer.hideOutline();writer.hideCharacter()}catch(e){}}
  writer.quiz({showHintAfterMisses:wsBlind?3:2,highlightOnComplete:true,
    onMistake:s=>wsMsg(`${s.strokeNum+1}번째 획 다시. ${wsBlind?3:2}번 틀리면 힌트가 떠.`),
    onCorrectStroke:s=>wsMsg(`${s.strokeNum+1} / ${s.strokeNum+1+s.strokesRemaining}획 좋아`),
    onComplete:s=>{const cs=chars();wsMsg(`완성! 틀린 횟수 ${s.totalMistakes}번`+(wsIdx<cs.length-1?" · 다음 글자로 넘어갈게":""));
      if(wsIdx<cs.length-1) setTimeout(()=>{wsIdx++;showChar();startQuiz()},1300);}});
  wsMsg(wsBlind?"윤곽 없이 기억만으로 써봐. 막히면 '획순 보기'.":"회색 윤곽 위에 획순대로 손가락으로 그어봐.");
  document.getElementById("ws-blind").setAttribute("aria-pressed",String(wsBlind));
  document.getElementById("ws-quiz").setAttribute("aria-pressed",String(!wsBlind));
}
function fallbackPad(){
  renderCI();
  const t=document.getElementById("ws-target"); t.innerHTML=`<div class="ghost" lang="zh-CN">${esc(chars()[wsIdx]||"")}</div><canvas></canvas>`;
  const cv=t.querySelector("canvas"), r=t.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  t.querySelector(".ghost").style.fontSize=Math.floor(r.width*0.78)+"px";
  cv.width=r.width*dpr; cv.height=r.height*dpr; const g=cv.getContext("2d"); g.scale(dpr,dpr);
  g.lineWidth=10; g.lineCap="round"; g.lineJoin="round"; g.strokeStyle=tok("--accent");
  let down=false; const pt=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener("pointerdown",e=>{down=true;cv.setPointerCapture(e.pointerId);const [x,y]=pt(e);g.beginPath();g.moveTo(x,y)});
  cv.addEventListener("pointermove",e=>{if(!down)return;const [x,y]=pt(e);g.lineTo(x,y);g.stroke()});
  cv.addEventListener("pointerup",()=>{down=false});
  writer=null;
}
function closeWriter(){ciCtl&&ciCtl.abort();document.getElementById("wsheet").hidden=true;document.getElementById("ws-target").innerHTML="";writer=null;stopAudio()}
function wireWriter(){
  const sh=document.getElementById("wsheet");
  sh.addEventListener("click",e=>{ if(e.target===sh) closeWriter();
    const c=e.target.closest("[data-wc]"); if(c){wsIdx=+c.dataset.wc; STROKES&&window.HanziWriter?showChar():fallbackPad()} });
  document.getElementById("ws-close").addEventListener("click",closeWriter);
  document.getElementById("ws-anim").addEventListener("click",()=>{ if(writer){writer.cancelQuiz&&writer.cancelQuiz();writer.showCharacter();writer.animateCharacter({onComplete:()=>wsMsg("이제 '따라 쓰기' 눌러서 직접 써봐.")});wsMsg("획순 보는 중…")} });
  document.getElementById("ws-quiz").addEventListener("click",()=>{ wsBlind=false; if(writer){writer.cancelQuiz&&writer.cancelQuiz();showChar();startQuiz()} else fallbackPad() });
  document.getElementById("ws-blind").addEventListener("click",()=>{ wsBlind=true; if(writer){writer.cancelQuiz&&writer.cancelQuiz();showChar();startQuiz()} else {fallbackPad();const g=document.querySelector("#ws-target .ghost");if(g)g.style.visibility="hidden";wsMsg("윤곽 없이 기억만으로 써봐.")} });
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sh.hidden)closeWriter()});
}

/* AI grammar analysis */
let SAMPLE=null, gCtl=null, gLine=null;
(async()=>{try{ if(window.claude&&typeof claude.use==="function"){ SAMPLE=await claude.use("sample"); if(SAMPLE) document.body.classList.add("ai-on"); } }catch(e){}})();
function mdLite(t){
  const out=[];let ul=false;
  const inline=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  t.split(/\n/).forEach(raw=>{const l=raw.trim();
    if(/^#{1,4}\s/.test(l)){if(ul){out.push("</ul>");ul=false}out.push(`<h4>${inline(l.replace(/^#+\s*/,""))}</h4>`)}
    else if(/^[-*•]\s/.test(l)){if(!ul){out.push("<ul>");ul=true}out.push(`<li>${inline(l.replace(/^[-*•]\s*/,""))}</li>`)}
    else if(l){if(ul){out.push("</ul>");ul=false}out.push(`<p>${inline(l)}</p>`)}});
  if(ul)out.push("</ul>"); return out.join("");
}
const G_ERR={not_granted:"AI 사용을 허용해야 분석할 수 있어. 다시 누르면 허용 창이 떠.",rate_limited:"요청이 몰렸어. 잠깐 뒤에 '다시 분석'을 눌러줘.",queue_overflow:"요청이 몰렸어. 잠깐 뒤에 '다시 분석'을 눌러줘.",sampling_disabled:"이 계정에서는 AI 분석을 쓸 수 없어.",capability_disabled:"이 계정에서는 AI 분석을 쓸 수 없어.",session_expired:"로그인이 만료됐어. 페이지를 새로 열어줘."};
function gPrompt(zh,py,ko){return `너는 중국어 TSC 4급을 준비하는 한국인 초급 학습자를 가르치는 중국어 선생님이야. 아래 중국어 문장을 한국어로 문법 분석해줘.

문장: ${zh}
병음: ${py}
뜻: ${ko}

아래 형식의 마크다운으로, 이 순서대로 간결하게 써줘. 다른 말은 붙이지 마.
## 문장 구조
문장 성분을 "我(주어) + 叫(술어) + 黄俊善(목적어)" 같은 한 줄로.
## 단어별 풀이
- 한자 (병음): 품사 · 뜻  ← 단어마다 한 줄
## 핵심 문법
- 문법 이름: 쓰임과 주의점 1~2문장 ← 2~3개
## 바꿔 말하기
- 같은 문형으로 TSC 답변에 쓸 만한 예문 2개. 각각 "중국어 / 병음 / 뜻" 한 줄
## 시험 팁
이 문장을 TSC 어느 파트에서 어떻게 응용하면 좋은지 한 줄.
문장에 빈칸(___)이 있으면 들어갈 수 있는 말 예시도 핵심 문법에 넣어줘.`}
async function runGram(force){
  if(!gLine||!SAMPLE) return;
  const {zh,py,ko}=gLine, key="tsc-gram:"+zh, out=document.getElementById("gs-out");
  const stop=document.getElementById("gs-stop"), again=document.getElementById("gs-again");
  if(!force){const c=store.get(key,null); if(c){out.innerHTML=mdLite(c);again.hidden=false;stop.hidden=true;return}}
  gCtl&&gCtl.abort(); gCtl=new AbortController();
  out.innerHTML='<p class="wait">분석하는 중…</p>'; stop.hidden=false; again.hidden=true;
  try{
    const {text}=await SAMPLE(gPrompt(zh,py,ko),{modelTier:"quick",signal:gCtl.signal,cache:!force,onText:({text})=>{out.innerHTML=mdLite(text)}});
    out.innerHTML=mdLite(text); store.set(key,text);
  }catch(e){
    const keep=e&&e.text?mdLite(e.text):"";
    if(e&&e.code==="cancelled") out.innerHTML=keep||'<p class="wait">멈췄어.</p>';
    else out.innerHTML=keep+`<p class="wait">${esc((e&&G_ERR[e.code])||"분석을 못 받아왔어. '다시 분석'을 눌러줘.")}</p>`;
  }finally{stop.hidden=true;again.hidden=false}
}
function openGram(ln){
  const zh=ln.querySelector("[data-say]").dataset.say;
  const py=(ln.querySelector(".c > .py")||{}).textContent||"", ko=(ln.querySelector(".c > .ko")||{}).textContent||"";
  gLine={zh,py,ko};
  document.getElementById("gs-title").textContent=zh;
  document.getElementById("gs-py").textContent=py;
  document.getElementById("gs-ko").textContent=ko;
  document.getElementById("gsheet").hidden=false;
  runGram(false);
}
function closeGram(){gCtl&&gCtl.abort();document.getElementById("gsheet").hidden=true}
(function(){
  const sh=document.getElementById("gsheet");
  sh.addEventListener("click",e=>{if(e.target===sh)closeGram()});
  document.getElementById("gs-close").addEventListener("click",closeGram);
  document.getElementById("gs-stop").addEventListener("click",()=>gCtl&&gCtl.abort());
  document.getElementById("gs-again").addEventListener("click",()=>runGram(true));
  document.addEventListener("click",e=>{const g=e.target.closest("[data-gram]");if(!g)return;e.preventDefault();const ln=g.closest(".line");if(ln)openGram(ln)});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sh.hidden)closeGram()});
})();

const HSKW=HSK.map(([l,zh,py,ko])=>({zh,py,ko,g:"h"+l,lv:"h"+l}));
const wordPool=g=>{
  if(g==="all"){const seen=new Set();return CORE.concat(HSKW).filter(w=>!seen.has(w.zh)&&seen.add(w.zh))}

};

function options(item,key){
  const same=(item.lv==="core"?wordPool(item.g):wordPool(item.lv)).filter(w=>w[key]!==item[key]);
  const rest=wordPool("all").filter(w=>w[key]!==item[key]&&!same.includes(w));

}

  const say=`<button class="say" type="button" data-say="${esc(it.zh)}" aria-label="발음 듣기">${SPK}</button>`;
  let body="";
  if(WQ.mode==="card"){

      <div class="fc-face fc-back"><span class="zh" lang="zh-CN">${esc(it.zh)}</span><span class="py">${esc(it.py)}</span><span class="wq-ko">${esc(it.ko)}</span>${exHTML(it.zh)}
        <span class="simctl" style="justify-content:center"><button class="say" type="button" data-say="${esc(it.zh)}" aria-label="발음 듣기">${SPK}</button><button class="btn ghost" type="button" data-fcw>써보기</button></span></div></div></div>
      <div class="fc-btns"><button class="btn ghost" type="button" data-fc="n">몰라요</button><button class="btn" type="button" data-fc="y">알아요</button></div>`;

  }

      <div class="wq-opts">${options(it,"ko").map(o=>`<button class="wq-opt" data-ans="${esc(o.zh)}">${esc(o.ko)}</button>`).join("")}</div>`;
  }else if(WQ.mode==="listen"){
    body=`<div class="wq-q">${say}<span class="g-note">듣고 맞는 단어를 고르세요</span></div>
      <div class="wq-opts">${options(it,"zh").map(o=>`<button class="wq-opt zh" lang="zh-CN" data-ans="${esc(o.zh)}">${esc(o.zh)}</button>`).join("")}</div>`;

  }else if(WQ.mode==="hanzi"){

      <div class="wq-opts">${options(it,"zh").map(o=>`<button class="wq-opt zh" lang="zh-CN" data-ans="${esc(o.zh)}">${esc(o.zh)}</button>`).join("")}</div>`;
  }else{
    body=`<div class="wq-q"><span class="wq-ko">${esc(it.ko)}</span><span class="py">${esc(it.py)}</span>${say}</div>
      <p class="g-note" id="wq-wmsg">윤곽 없이 손가락으로 써봐. 3번 틀리면 힌트가 떠.</p>
      <div class="ws-pad wq-pad"><svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0V100M0 50H100M0 0L100 100M100 0L0 100"/></svg><div id="wq-target" style="position:absolute;inset:0"></div></div>
      <div class="simctl" style="justify-content:center"><button class="btn ghost" type="button" id="wq-giveup">모르겠어</button></div>`;
  }

  if(WQ.mode==="write") startWriteQ(it);

function mark(ok,it){
  if(WQ.answered) return; WQ.answered=true;
  const w=new Set(wrongSet());
  if(ok){WQ.score++; w.delete(it.zh)} else {WQ.wrong.push(it); w.add(it.zh)}
  store.set("tsc-wrong",[...w]);
  const fb=document.getElementById("wq-fb");
  fb.className="wq-fb "+(ok?"ok":"no");
  fb.innerHTML=`${ok?"정답!":"아쉬워"} <span class="zh" lang="zh-CN">${esc(it.zh)}</span> <span class="py">${esc(it.py)}</span> · ${esc(it.ko)}`+exHTML(it.zh);
  if(WQ.mode!=="listen") ttsSpeak(it.zh);
  const nx=document.getElementById("wq-next"); nx.hidden=false;
  if(ok&&WQ.mode!=="write") setTimeout(()=>{ if(document.getElementById("wq-next")===nx) nextQ() },1100);
}
function nextQ(){ WQ.i++; if(WQ.i<WQ.items.length) renderQ(); else endQuiz(); }
function endQuiz(){
  const n=WQ.items.length, box=document.getElementById("wq-box");
  const label=WQ_MODES.find(m=>m[0]===WQ.mode)[1];
  store.set("tsc-wq-last",`최근: ${label} ${WQ.score}/${n}`);
  box.innerHTML=`<div class="wq-end"><b>${WQ.score} / ${n}</b>${WQ.mode==="card"?"<span>안다고 한 카드 수</span>":""}<span>${WQ.score===n?"다 맞혔어!":WQ.score>=n*0.7?"좋아, 틀린 것만 한 번 더":"틀린 단어 위주로 다시 보자"}</span></div>
   ${WQ.wrong.length?`<div class="eyebrow">틀린 단어</div><div class="words">${WQ.wrong.map(w=>`<div class="word" role="button" tabindex="0" data-word="${esc(w.zh)}|${esc(w.py)}|${esc(w.ko)}"><div class="zh" lang="zh-CN">${esc(w.zh)}</div><div class="py">${esc(w.py)}</div><div class="ko">${esc(w.ko)}</div></div>`).join("")}</div>`:""}
   <div class="simctl" style="justify-content:center">${WQ.wrong.length?`<button class="btn" type="button" id="wq-retry">틀린 것만 다시</button>`:""}<button class="btn ghost" type="button" id="wq-again">새로 10문제</button></div>`;
  document.getElementById("wq-last").textContent=store.get("tsc-wq-last","");
}
function startWriteQ(it){
  const msg=t=>{const m=document.getElementById("wq-wmsg");if(m)m.textContent=t};
  WQ.mist=0; WQ.ci=0;
  const cs=[...it.zh].filter(c=>/[一-鿿]/.test(c));
  loadHW().then(()=>{
    const go=()=>{
      const t=document.getElementById("wq-target"); if(!t) return; t.innerHTML="";
      const size=Math.floor(t.getBoundingClientRect().width)||240;
      WQ.writer=HanziWriter.create(t,cs[WQ.ci],{width:size,height:size,padding:14,showOutline:false,showCharacter:false,
        strokeColor:tok("--fg"),outlineColor:tok("--line"),drawingColor:tok("--accent"),highlightColor:tok("--seal"),drawingWidth:Math.max(14,size/16),
        charDataLoader:(ch,ok,err)=>{STROKES&&STROKES[ch]?ok(STROKES[ch]):err()}});
      msg(cs.length>1?`${WQ.ci+1}/${cs.length}번째 글자. 윤곽 없이 써봐.`:"윤곽 없이 손가락으로 써봐. 3번 틀리면 힌트가 떠.");
      WQ.writer.quiz({showHintAfterMisses:3,onComplete:s=>{WQ.mist+=s.totalMistakes;
        if(WQ.ci<cs.length-1){WQ.ci++;setTimeout(go,700)} else {msg(`틀린 획 ${WQ.mist}번`);mark(WQ.mist<=cs.length,it)}}});
    }; go();
  }).catch(()=>{msg("획순 데이터를 못 불러와서 쓰기 시험은 지금 못 해. 다른 방식으로 해줘.")});
}
function wireQuiz(){
  const v=document.getElementById("v-words");
  v.addEventListener("click",e=>{
    const m=e.target.closest("[data-wqm]"); if(m){WQ.mode=m.dataset.wqm;v.querySelectorAll("[data-wqm]").forEach(x=>x.setAttribute("aria-pressed",String(x===m)));const sb=document.getElementById("wq-start");if(sb)sb.textContent=WQ.mode==="card"?"카드 20장 시작":"10문제 시작";return}
    const fc=e.target.closest(".fc-card"); if(fc&&!e.target.closest("button,[data-say]")){fc.classList.toggle("flip");if(fc.classList.contains("flip"))ttsSpeak(WQ.items[WQ.i].zh);return}
    const fk=e.target.closest("[data-fc]"); if(fk){const it=WQ.items[WQ.i];const know=fk.dataset.fc==="y";const w=new Set(wrongSet());if(know){WQ.score++;w.delete(it.zh)}else{WQ.wrong.push(it);w.add(it.zh)}store.set("tsc-wrong",[...w]);nextQ();return}
    const fw=e.target.closest("[data-fcw]"); if(fw){const it=WQ.items[WQ.i];openWriter({zh:it.zh,py:it.py,ko:it.ko},0,true);return}
    if(e.target.closest("#wq-start")||e.target.closest("#wq-again")){startWordQuiz(shuffle(wordPool(WQ.group)).slice(0,WQ.mode==="card"?20:10));return}
    if(e.target.closest("#wq-retry")){startWordQuiz(shuffle(WQ.wrong));return}
    if(e.target.closest("#wq-review")){const s=new Set(wrongSet());startWordQuiz(shuffle(wordPool("all").filter(w=>s.has(w.zh))).slice(0,10));return}
    const o=e.target.closest(".wq-opt"); if(o&&!WQ.answered){const it=WQ.items[WQ.i];const ok=o.dataset.ans===it.zh;
      o.classList.add(ok?"ok":"no"); if(!ok) v.querySelectorAll(".wq-opt").forEach(b=>{if(b.dataset.ans===it.zh)b.classList.add("ok")}); mark(ok,it);return}
    if(e.target.closest("#wq-next")){nextQ();return}
    if(e.target.closest("#wq-giveup")){const it=WQ.items[WQ.i];if(WQ.writer){try{WQ.writer.cancelQuiz();WQ.writer.showCharacter();WQ.writer.animateCharacter()}catch(_){}}mark(false,it);return}
  });
  v.addEventListener("change",e=>{if(e.target.id==="wq-group")WQ.group=e.target.value});
}

/* character origin info */
let CI=null, ciLoading=null, ciCtl=null;
const CI_TY={"상형":"사물 모양을 본뜬 글자","회의":"뜻을 가진 부분끼리 합친 글자","형성":"뜻 부분 + 소리 부분을 합친 글자"};
function loadCI(){ if(CI) return Promise.resolve(CI); if(ciLoading) return ciLoading;
  ciLoading=fetch("chars.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{CI=d;return d}).catch(e=>{ciLoading=null;throw e}); return ciLoading; }
function renderCI(){
  const box=document.getElementById("ws-info"); if(!box||!wsWord) return;
  const c=chars()[wsIdx]; if(!c){box.innerHTML="";return}
  loadCI().then(d=>{
    if(chars()[wsIdx]!==c) return;

    if(!x){box.innerHTML=`<div class="ci-h"><b class="zh" lang="zh-CN">${esc(c)}</b><span class="g-note">글자 정보가 없어</span></div>`;return}
    const parts=x.ty==="형성"&&x.se&&x.ph?`<span class="zh" lang="zh-CN">${esc(x.se)}</span>(뜻) + <span class="zh" lang="zh-CN">${esc(x.ph)}</span>(소리)`:(x.cp||[]).map(p=>`<span class="zh" lang="zh-CN">${esc(p)}</span>`).join(" + ");

      ${x.ty||parts?`<div class="ci-l">${x.ty?`<b>${esc(x.ty)}자</b> · ${esc(CI_TY[x.ty]||"")}`:""}${parts?`<div class="ci-p">${parts}</div>`:""}</div>`:""}
      <div class="ci-out" id="ci-out">${cached?mdLite(cached):""}</div>
      ${SAMPLE?`<div class="simctl" style="justify-content:center"><button class="gram" style="display:inline-block" type="button" id="ci-ask">${cached?"AI 설명 다시 받기":"AI로 훈음·유래 자세히"}</button></div>`:""}`;
    const b=document.getElementById("ci-ask"); if(b) b.addEventListener("click",()=>askCI(c,x,!!cached));
  }).catch(()=>{box.innerHTML=`<p class="g-note">글자 정보를 못 불러왔어.</p>`});
}
async function askCI(c,x,force){
  if(!SAMPLE) return; const out=document.getElementById("ci-out"); if(!out) return;
  ciCtl&&ciCtl.abort(); ciCtl=new AbortController();
  out.innerHTML='<p class="wait">설명 만드는 중…</p>';
  const prompt=`너는 한국 학습자에게 한자를 가르치는 선생님이야. 중국어 간체자 「${c}」에 대해 한국어로 짧게 설명해줘.
번체: ${x.t||c} / 한국 한자음: ${x.k||"모름"} / 부수: ${x.r||"-"} / 구성: ${(x.cp||[]).join(" + ")} / 유형: ${x.ty||"-"}
참고(영어 자료): 뜻 ${x.d||"-"}; 유래 메모 ${x.h||"-"}

아래 마크다운 형식으로만, 짧게 써줘.
## 훈음
'굳셀 건'처럼 한국식 훈과 음 한 줄. 간체와 번체가 다르면 번체 모양도 짧게 언급.
## 유래
2~3문장. 어떤 모양이나 뜻이 합쳐져 만들어졌는지.
## 구성 요소
- 부분: 뜻 (부분마다 한 줄)
## 외우는 팁
한 줄.
## 같은 부분이 들어간 글자
- 2개. "글자(병음): 뜻" 형식.`;
  try{
    const {text}=await SAMPLE(prompt,{modelTier:"quick",signal:ciCtl.signal,cache:!force,onText:({text})=>{const o=document.getElementById("ci-out");if(o)o.innerHTML=mdLite(text)}});
    store.set("tsc-ci:"+c,text); const o=document.getElementById("ci-out"); if(o) o.innerHTML=mdLite(text);
    const b=document.getElementById("ci-ask"); if(b) b.textContent="AI 설명 다시 받기";
  }catch(e){const o=document.getElementById("ci-out"); if(o&&(!e||e.code!=="cancelled")) o.innerHTML=(e&&e.text?mdLite(e.text):"")+`<p class="wait">${esc((e&&G_ERR[e.code])||"설명을 못 받아왔어. 다시 눌러줘.")}</p>`}
}

function stopShadow(){shadowRun=null;stopAudio();
  document.querySelectorAll(".line.playing,.line.repeat,.word.playing").forEach(x=>x.classList.remove("playing","repeat"));
  document.querySelectorAll("[data-shadow]").forEach(b=>b.textContent="따라 말하기");
  document.querySelectorAll(".shadowbar .st").forEach(s=>{s.textContent="";s.className="st"});}
async function playOne(el,text){
  if(shadowRun) stopShadow();
  document.querySelectorAll(".line.playing,.word.playing").forEach(x=>x.classList.remove("playing"));
  el&&el.classList.add("playing"); await ttsSpeak(text); el&&el.classList.remove("playing");
}
document.addEventListener("click",e=>{
  const sh=e.target.closest("[data-shadow]");
  if(sh){e.preventDefault();runShadow(sh);return}
  const b=e.target.closest("[data-say]"); if(!b) return;
  e.preventDefault(); playOne(b.closest(".line")||b, b.dataset.say);
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".tap[data-say]")){e.preventDefault();playOne(e.target,e.target.dataset.say)}});
const wordOf=el=>{const [zh,py,ko]=el.dataset.word.split("|");return {zh,py,ko}};
document.addEventListener("click",e=>{const w=e.target.closest(".word[data-word]");if(w){e.preventDefault();openWriter(wordOf(w))}});
document.addEventListener("click",e=>{const h=e.target.closest(".hz");if(!h)return;const ln=h.closest(".line");if(!ln)return;e.preventDefault();
  const all=[...ln.querySelectorAll(".zh .hz")];const zh=ln.querySelector("[data-say]")?ln.querySelector("[data-say]").dataset.say:all.map(x=>x.textContent).join("");
  const py=(ln.querySelector(".c > .py")||{}).textContent||"";const ko=(ln.querySelector(".c > .ko")||{}).textContent||"";
  openWriter({zh,py,ko},Math.max(0,all.indexOf(h)),true)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".word[data-word]")){e.preventDefault();openWriter(wordOf(e.target))}});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function runShadow(btn){
  if(shadowRun){const was=btn.textContent==="멈추기";stopShadow();if(was)return}
  const token={};shadowRun=token;btn.textContent="멈추기";
  const body=btn.closest(".pbody"), st=body.querySelector(".shadowbar .st");
  const lines=[...body.querySelectorAll(":scope > .line")];
  for(let i=0;i<lines.length;i++){
    if(shadowRun!==token) return;
    const ln=lines[i], text=ln.querySelector("[data-say]").dataset.say;
    ln.scrollIntoView({block:"center",behavior:"smooth"});
    ln.classList.add("playing"); st.className="st"; st.textContent=`${i+1}/${lines.length} 듣기`;
    await ttsSpeak(text); if(shadowRun!==token) return;
    ln.classList.remove("playing"); ln.classList.add("repeat");
    st.className="st rep"; st.textContent=`${i+1}/${lines.length} 따라 말하기`;
    const len=text.replace(/[^一-鿿]/g,"").length;
    await wait(Math.max(2500,(900+len*380)/rateNow())); if(shadowRun!==token) return;
    ln.classList.remove("repeat");
  }
  if(shadowRun===token){shadowRun=null;btn.textContent="다시 따라 말하기";st.className="st";st.textContent="끝";}
}
function checkVoices(){return;try{const vs=speechSynthesis.getVoices();const n=document.getElementById("voice-note");if(n&&vs.length)n.hidden=!!zhVoice()}catch(e){}}
try{speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",checkVoices)}catch(e){}
setTimeout(checkVoices,800);

/* routing */
const VIEWS=["plan","pron","sim","tpl","qs","words","day"];
function show(){
  let h=location.hash.replace("#",""); if(!VIEWS.includes(h)) h="plan";
  VIEWS.forEach(x=>document.getElementById("v-"+x).hidden=(x!==h));
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.v===h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.getElementById("toggles").hidden=(h==="plan"||h==="day");
}
(function(){const h=document.querySelector("header.top");let c=false;
  window.addEventListener("scroll",()=>{const y=window.scrollY;if(!c&&y>140){c=true;h.classList.add("compact")}else if(c&&y<20){c=false;h.classList.remove("compact")}},{passive:true});})();
window.addEventListener("hashchange",()=>{show();window.scrollTo(0,0)});
wireWriter();wireRec();wireQuiz();renderPlan();renderPron();renderSimView();renderTpl();renderQs();renderWords();renderDay();show();
</script>
